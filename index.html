<!DOCTYPE html>

<html lang="pt-BR">

<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Título da página -->
<title>Mudança de Texto</title>

<style>

/* Estilo geral do corpo da página */
body {
    font-family: sans-serif; /* Fonte padrão */
    display: flex; /* Usa flexbox */
    flex-direction: column; /* Organiza em coluna */
    align-items: center; /* Centraliza horizontalmente */
    justify-content: center; /* Centraliza verticalmente */
    height: 100vh; /* Ocupa 100% da altura da tela */
    margin: 0; /* Remove margem padrão */
    background-color: #f0f2f5; /* Cor de fundo */
}

/* Caixa principal */
.container {
    text-align: center; /* Centraliza o texto */
    background-color: white; /* Fundo branco */
    padding: 40px; /* Espaçamento interno */
    border-radius: 12px; /* Bordas arredondadas */
    box-shadow: 0 4px 8px #0e01011a; /* Sombra */
}

/* Estilo do título */
h1 {
    color: #000000; /* Cor do texto */
    margin-bottom: 20px; /* Espaço abaixo */
    font-size: 24px; /* Tamanho da fonte */
}

/* Estilo do botão */
button {
    padding: 12px 24px; /* Espaçamento interno */
    font-size: 16px; /* Tamanho do texto */
    cursor: pointer; /* Mostra a mãozinha ao passar o mouse */
    background-color: #007bff; /* Cor de fundo */
    color: white; /* Cor do texto */
    border: #0056b3 solid; /* Cor da borda  */
    border-radius: 8px; /* Bordas arredondadas */
}

/* Efeito ao passar o mouse no botão */
button:hover {
    background-color: #0056b3; /* Cor mais escura */
}

</style>

</head>

<body>

<!-- Container principal da página -->
<div class="container">

<!-- Texto que será alterado pelo JavaScript -->
<h1 id="meuTexto">Clique no botão azul para mudar este texto.</h1>

<!-- Botão que chama a função alterarTexto() ao ser clicado -->
<button onclick="alterarTexto()">Clique Aqui</button>


</div>

<!-- Importa o arquivo JavaScript externo -->
<script src="script.js"></script>

</body>
</html>
