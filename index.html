<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mudança de Texto</title>

<style>

body {
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    background-color: #f0f2f5;
}

.container {
    text-align: center;
    background-color: white;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 4px 8px #0e01011a;
}

h1 {
    color: #000000;
    margin-bottom: 20px;
    font-size: 24px;
}

button {
    padding: 12px 24px;
    font-size: 16px;
    cursor: pointer;
    background-color: #007bff;
    color: white;
    border: #0056b3;
    border-radius: 8px;
}

button:hover {
    background-color: #0056b3;
}

</style>

</head>
<body>

<div class="container">

<h1 id="meuTexto">Clique no botão azul para mudar este texto.</h1>

<button onclick="alterarTexto()">Clique Aqui</button>

</div>

<script src="script.js"></script>

</body>
</html>
