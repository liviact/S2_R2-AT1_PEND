<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha Lista</title>

<style>

body{
    font-family: Arial, Helvetica, sans-serif;
    background: #f2f4f8;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}


.container{
    background: white;
    padding: 25px;
    border-radius: 10px;
    width: 320px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

h2{
    text-align: center;
    margin-bottom: 15px;
}


.input-area{
    display: flex;
    gap: 10px;
}

input{
    flex: 1;
    padding: 8px;
    border-radius: 5px;
    border: 1px solid #ccc;
}


button{
    padding: 8px 12px;
    border: none;
    background: #4CAF50;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}

button:hover{
    background: #43a047;
}


ul{
    margin-top: 15px;
    list-style: none;
    padding: 0;
}

li{
    background: #f7f7f7;
    padding: 8px;
    border-radius: 5px;
    margin-top: 5px;
}

</style>
</head>

<body>

<div class="container">

<h2>lista diva 🎀</h2>

<div class="input-area">
<input type="text" id="input" placeholder="Digite algo">
<button id="botao">Adicionar</button>
</div>

<ul id="lista"></ul>

</div>

<script src="script.js"></script>
</body>
</html>
